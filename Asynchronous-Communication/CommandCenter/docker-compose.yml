services:
  commandcenter:
    image: ${DOCKER_REGISTRY-}commandcenter
    build:
      context: .
      dockerfile: CommandCenter/Dockerfile

  ccui:
    image: ${DOCKER_REGISTRY-}ccui
    build:
      context: .
      dockerfile: CCUI/Dockerfile

  mongo:
    image: mongo
    container_name: mongo
    ports:
      - 27017:27017
    volumes:
      - mongodbdata:/data/db

  rabbitmq: 
    image: rabbitmq:management
    container_name: rabbitmq
    ports:
      - 5672:5672
      - 15672:15672
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    hostname: rabbitmq

volumes:
  mongodbdata:
  rabbitmqdata:
